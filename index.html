<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header class="header">
    <div class="header__brand">
      <svg class="header__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span class="header__title">Life Dashboard</span>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle Light / Dark Mode">
      <!-- Moon icon (shown in light mode) -->
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <!-- Sun icon (shown in dark mode) -->
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
  </header>

  <!-- ========== MAIN DASHBOARD ========== -->
  <main class="dashboard">

    <!-- ---- GREETING CARD ---- -->
    <section class="card card--greeting" aria-label="Greeting">
      <div class="greeting__time-wrap">
        <p class="greeting__time" id="greetingTime">00:00:00</p>
        <p class="greeting__date" id="greetingDate">Monday, January 1, 2026</p>
      </div>
      <div class="greeting__message">
        <p class="greeting__label" id="greetingLabel">Good Morning,</p>
        <!-- Inline editable name -->
        <div class="greeting__name-wrap">
          <span class="greeting__name" id="greetingName" title="Click to change your name">Friend</span>
          <button class="btn-icon" id="editNameBtn" aria-label="Edit name" title="Edit name">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
        </div>
        <!-- Hidden edit input -->
        <div class="greeting__name-edit hidden" id="nameEditWrap">
          <input type="text" class="input-name" id="nameInput" maxlength="30" placeholder="Enter your name…" autocomplete="off" />
          <button class="btn btn--primary btn--sm" id="saveNameBtn">Save</button>
          <button class="btn btn--ghost btn--sm" id="cancelNameBtn">Cancel</button>
        </div>
      </div>
    </section>

    <!-- ---- FOCUS TIMER CARD ---- -->
    <section class="card card--timer" aria-label="Focus Timer">
      <div class="card__header">
        <h2 class="card__title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          Focus Timer
        </h2>
      </div>

      <!-- Timer display -->
      <div class="timer__display" id="timerDisplay" aria-live="polite">25:00</div>
      <p class="timer__status" id="timerStatus">Ready</p>

      <!-- Timer controls -->
      <div class="timer__controls">
        <button class="btn btn--primary" id="timerStart">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Start
        </button>
        <button class="btn btn--secondary" id="timerStop" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          Stop
        </button>
        <button class="btn btn--ghost" id="timerReset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 .49-4.5"/>
          </svg>
          Reset
        </button>
      </div>

      <!-- Pomodoro duration setting -->
      <div class="timer__setting">
        <label class="setting__label" for="pomodoroInput">Pomodoro Duration (minutes)</label>
        <div class="timer__setting-row">
          <input type="number" class="input-number" id="pomodoroInput" min="1" max="60" value="25" />
          <button class="btn btn--primary btn--sm" id="applyPomodoro">Apply</button>
        </div>
      </div>
    </section>

    <!-- ---- TO-DO LIST CARD ---- -->
    <section class="card card--todo" aria-label="To-Do List">
      <div class="card__header">
        <h2 class="card__title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"/>
            <line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <polyline points="3 6 4 7 6 5"/>
            <polyline points="3 12 4 13 6 11"/>
            <polyline points="3 18 4 19 6 17"/>
          </svg>
          To-Do List
        </h2>
        <!-- Sort dropdown -->
        <div class="todo__sort-wrap">
          <label class="sr-only" for="taskSort">Sort tasks</label>
          <select class="select-sort" id="taskSort" title="Sort tasks">
            <option value="default">Default</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
            <option value="completed">Completed First</option>
            <option value="pending">Pending First</option>
          </select>
        </div>
      </div>

      <!-- Add task form -->
      <form class="todo__form" id="taskForm" autocomplete="off">
        <input
          type="text"
          class="input-text"
          id="taskInput"
          placeholder="Add a new task…"
          maxlength="100"
          aria-label="New task"
        />
        <button type="submit" class="btn btn--primary">Add</button>
      </form>

      <!-- Duplicate warning -->
      <p class="todo__warning hidden" id="duplicateWarning" role="alert">
        ⚠ Task already exists!
      </p>

      <!-- Task stats -->
      <div class="todo__stats" id="todoStats">
        <span id="statTotal">0 tasks</span>
        <span id="statDone">0 done</span>
      </div>

      <!-- Task list -->
      <ul class="task-list" id="taskList" aria-label="Task list">
        <!-- Tasks injected by JS -->
      </ul>

      <p class="todo__empty" id="todoEmpty">No tasks yet. Add one above!</p>
    </section>

    <!-- ---- QUICK LINKS CARD ---- -->
    <section class="card card--links" aria-label="Quick Links">
      <div class="card__header">
        <h2 class="card__title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          Quick Links
        </h2>
      </div>

      <!-- Add link form -->
      <form class="links__form" id="linkForm" autocomplete="off">
        <input
          type="text"
          class="input-text"
          id="linkName"
          placeholder="Link name"
          maxlength="30"
          aria-label="Link name"
        />
        <input
          type="url"
          class="input-text"
          id="linkUrl"
          placeholder="https://example.com"
          aria-label="Link URL"
        />
        <button type="submit" class="btn btn--primary">Add</button>
      </form>

      <!-- Links grid -->
      <div class="links__grid" id="linksList">
        <!-- Links injected by JS -->
      </div>

      <p class="links__empty" id="linksEmpty">No links yet. Add one above!</p>
    </section>

  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <p>Life Dashboard &copy; 2026 &mdash; Stay focused, stay productive.</p>
  </footer>

  <!-- Edit task modal -->
  <div class="modal-overlay hidden" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
    <div class="modal">
      <h3 class="modal__title" id="editModalTitle">Edit Task</h3>
      <input type="text" class="input-text" id="editTaskInput" maxlength="100" placeholder="Task text…" />
      <div class="modal__actions">
        <button class="btn btn--primary" id="saveEditBtn">Save</button>
        <button class="btn btn--ghost" id="cancelEditBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
